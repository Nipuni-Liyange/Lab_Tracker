services:
  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/lab_tracker
      PORT: 5000
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo_data: